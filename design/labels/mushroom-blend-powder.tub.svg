  <g id="info" transform="translate(37.5 34.5) scale(1.36)"><g><text x="0" y="9" font-size="7" fill="#14213d" font-family="'Inter'"><tspan font-weight="700">Directions:</tspan> Stir 1 scoop into coffee, tea or a smoothie daily.</text><text x="0" y="21" font-size="7" fill="#14213d" font-family="'Inter'"><tspan font-weight="700">Caution:</tspan> Do not exceed the recommended dose. Consult your healthcare</text><text x="0" y="30" font-size="7" fill="#14213d" font-family="'Inter'">provider before use if you are pregnant, nursing, taking medication or</text><text x="0" y="39" font-size="7" fill="#14213d" font-family="'Inter'">have a medical condition. Keep out of reach of children.</text><text x="0" y="51" font-size="7" fill="#14213d" font-family="'Inter'"><tspan font-weight="700">Store</tspan> in a cool, dry place. Do not use if the seal under the cap is</text><text x="0" y="60" font-size="7" fill="#14213d" font-family="'Inter'">broken or missing.</text><rect x="0" y="68" width="250" height="33.4" fill="none" stroke="#14213d" stroke-width="0.6"/><text x="4" y="76" font-size="7" font-weight="700" fill="#14213d" font-family="'Inter'">*These statements have not been evaluated by the Food and Drug</text><text x="4" y="84.8" font-size="7" font-weight="700" fill="#14213d" font-family="'Inter'">Administration. This product is not intended to diagnose, treat,</text><text x="4" y="93.6" font-size="7" font-weight="700" fill="#14213d" font-family="'Inter'">cure, or prevent any disease.</text></g></g>
