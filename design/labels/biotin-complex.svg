    <text x="24" y="39" font-size="24" font-weight="500" letter-spacing="-0.24" font-family="'Funnel Display'"><tspan fill="#ffffff">noo</tspan><tspan fill="#ffffff" fill-opacity="1">vit</tspan></text>
    <rect x="100.17" y="23.49" width="3.18" height="3.18" rx="0.38" fill="#ff5f00" opacity="1"/><rect x="100.17" y="19.8" width="3.18" height="3.18" rx="0.38" fill="#ff5f00" opacity="0.6"/><rect x="103.86" y="23.49" width="3.18" height="3.18" rx="0.38" fill="#ff5f00" opacity="0.8"/><rect x="100.17" y="27.18" width="3.18" height="3.18" rx="0.38" fill="#ff5f00" opacity="0.5"/><rect x="96.48" y="23.49" width="3.18" height="3.18" rx="0.38" fill="#ff5f00" opacity="0.4"/>
    <rect x="24" y="49" width="24" height="1.1" fill="#f7eef2"/>
    <rect x="160" y="23" width="40" height="12.5" rx="6.25" fill="#C9558F"/><text x="180" y="31.65" text-anchor="middle" font-size="6.6" font-weight="700" letter-spacing="1.32" fill="#fff" font-family="'Inter'">FOR HER</text>
    <text x="24" y="66.56" text-anchor="start" font-size="6.2" font-weight="600" letter-spacing="1.24" fill="#f7eef2" font-family="'Inter'">HAIR, SKIN · NAILS</text>
    <text x="24" y="91.16" text-anchor="start" font-size="17.5" font-weight="500" letter-spacing="-0.35" fill="#ffffff" font-family="'Manrope'">Biotin</text>
    <text x="24" y="107.43" text-anchor="start" font-size="11" font-weight="400" letter-spacing="-0.1" fill="#f7eef2" font-family="'Manrope'">Complex</text>
    <text x="24" y="127.33" font-size="7.6" text-anchor="start" font-weight="500" fill="#ffffff" font-family="'Inter'">With Zinc &amp; Selenium</text>
    <text x="24" y="146.18" font-size="7.2" text-anchor="start" font-weight="400" fill="rgba(255,255,255,0.78)" font-family="'Inter'">Supports stronger hair and nails*</text>
    <rect x="24" y="182" width="176" height="0.5" fill="rgba(255,255,255,0.28)"/>
    <text x="24" y="199" text-anchor="start" font-size="6.2" font-weight="600" letter-spacing="1.24" fill="#ffffff" font-family="'Inter'">DIETARY SUPPLEMENT</text>
    <text x="24" y="208.5" text-anchor="start" font-size="6.2" font-weight="500" letter-spacing="1.24" fill="rgba(255,255,255,0.78)" font-family="'Inter'">60 SERVINGS</text>
    <text x="200" y="199" text-anchor="end" font-size="16" font-weight="500" fill="#ffffff" font-family="'Manrope'">60</text>
    <text x="200" y="209.5" text-anchor="end" font-size="6.2" font-weight="600" letter-spacing="1.24" fill="#ffffff" font-family="'Inter'">CAPSULES</text>
  </g></g>
  <g id="facts" transform="translate(432.5 24.5) scale(1)"><g><text x="0" y="17" font-size="17" font-weight="700" letter-spacing="-0.3" fill="#000" font-family="'Inter'">Supplement Facts</text><rect x="0" y="21" width="168" height="0.8" fill="#000"/><text x="0" y="32" font-size="8" fill="#000" font-family="'Inter'">Serving Size: 1 Capsule</text><text x="0" y="43" font-size="8" fill="#000" font-family="'Inter'">Servings Per Container: 60</text><rect x="0" y="47" width="168" height="5" fill="#000"/><text x="0" y="60" font-size="8" font-weight="700" fill="#000" font-family="'Inter'">Amount Per Serving</text><text x="168" y="60" text-anchor="end" font-size="8" font-weight="700" fill="#000" font-family="'Inter'">% Daily Value</text><rect x="0" y="63" width="168" height="1.5" fill="#000"/><text x="0" y="74" font-size="8" fill="#000" font-family="'Inter'">Biotin</text><text x="134" y="74" text-anchor="end" font-size="8" fill="#000" font-family="'Inter'">5000mcg</text><text x="168" y="74" text-anchor="end" font-size="8" font-weight="700" fill="#000" font-family="'Inter'">16667%</text><rect x="0" y="77" width="168" height="0.6" fill="#000"/><text x="0" y="88" font-size="8" fill="#000" font-family="'Inter'">Zinc</text><text x="134" y="88" text-anchor="end" font-size="8" fill="#000" font-family="'Inter'">10mg</text><text x="168" y="88" text-anchor="end" font-size="8" font-weight="700" fill="#000" font-family="'Inter'">91%</text><rect x="0" y="91" width="168" height="0.6" fill="#000"/><text x="0" y="102" font-size="8" fill="#000" font-family="'Inter'">Selenium</text><text x="134" y="102" text-anchor="end" font-size="8" fill="#000" font-family="'Inter'">55mcg</text><text x="168" y="102" text-anchor="end" font-size="8" font-weight="700" fill="#000" font-family="'Inter'">100%</text><rect x="0" y="105" width="168" height="0.6" fill="#000"/><rect x="0" y="107" width="168" height="5" fill="#000"/><text x="0" y="119" font-size="8" fill="#000" font-family="'Inter'">Other ingredients: Vegetable capsule</text><text x="0" y="129" font-size="8" fill="#000" font-family="'Inter'">(HPMC).</text></g></g>
  
</svg>