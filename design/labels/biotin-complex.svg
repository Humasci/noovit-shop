<svg xmlns="http://www.w3.org/2000/svg" width="6.25in" height="2.5in" viewBox="0 0 625 250">
  <title>Noovit label — Biotin Complex (draft)</title>
  <rect width="625" height="250" fill="#612e4a"/>
  <rect x="17.5" y="17.5" width="180" height="215" rx="3" fill="#fff"/>
  <rect x="427.5" y="17.5" width="180" height="215" rx="3" fill="#fff"/>
  <g id="info" transform="translate(24.5 24.5)"><g><text x="0" y="9" font-size="7" fill="#14213d" font-family="'Inter'"><tspan font-weight="700">Directions:</tspan> Take 1 capsule daily.</text><text x="0" y="21" font-size="7" fill="#14213d" font-family="'Inter'"><tspan font-weight="700">Caution:</tspan> Do not exceed the recommended dose.</text><text x="0" y="30" font-size="7" fill="#14213d" font-family="'Inter'">Consult your healthcare provider before use if</text><text x="0" y="39" font-size="7" fill="#14213d" font-family="'Inter'">you are pregnant, nursing, taking medication or</text><text x="0" y="48" font-size="7" fill="#14213d" font-family="'Inter'">have a medical condition. Keep out of reach of</text><text x="0" y="57" font-size="7" fill="#14213d" font-family="'Inter'">children. Biotin can interfere with some lab</text><text x="0" y="66" font-size="7" fill="#14213d" font-family="'Inter'">tests, including heart (troponin) and thyroid</text><text x="0" y="75" font-size="7" fill="#14213d" font-family="'Inter'">tests. Tell your doctor and the lab that you</text><text x="0" y="84" font-size="7" fill="#14213d" font-family="'Inter'">take biotin before any blood test.</text><text x="0" y="96" font-size="7" fill="#14213d" font-family="'Inter'"><tspan font-weight="700">Store</tspan> in a cool, dry place. Do not use if the</text><text x="0" y="105" font-size="7" fill="#14213d" font-family="'Inter'">seal under the cap is broken or missing.</text><rect x="0" y="113" width="168" height="42.2" fill="none" stroke="#14213d" stroke-width="0.6"/><text x="4" y="121" font-size="7" font-weight="700" fill="#14213d" font-family="'Inter'">*These statements have not been evaluated</text><text x="4" y="129.8" font-size="7" font-weight="700" fill="#14213d" font-family="'Inter'">by the Food and Drug Administration. This</text><text x="4" y="138.6" font-size="7" font-weight="700" fill="#14213d" font-family="'Inter'">product is not intended to diagnose, treat,</text><text x="4" y="147.4" font-size="7" font-weight="700" fill="#14213d" font-family="'Inter'">cure, or prevent any disease.</text></g>
    <g transform="translate(0 182.5)">
      <text x="0" y="6" font-size="7" font-weight="700" fill="#14213d" font-family="'Inter'">Distributed by Noovit LLC</text>
      <text x="0" y="15.5" font-size="7" fill="#14213d" font-family="'Inter'">30 N Gould St Ste R, Sheridan, WY 82801</text>
    </g>
  </g>
