    <rect x="100.17" y="23.49" width="3.18" height="3.18" rx="0.38" fill="#ff5f00" opacity="1"/><rect x="100.17" y="19.8" width="3.18" height="3.18" rx="0.38" fill="#ff5f00" opacity="0.6"/><rect x="103.86" y="23.49" width="3.18" height="3.18" rx="0.38" fill="#ff5f00" opacity="0.8"/><rect x="100.17" y="27.18" width="3.18" height="3.18" rx="0.38" fill="#ff5f00" opacity="0.5"/><rect x="96.48" y="23.49" width="3.18" height="3.18" rx="0.38" fill="#ff5f00" opacity="0.4"/>
    <rect x="24" y="49" width="24" height="1.1" fill="#cf8baf"/>
    <text x="24" y="66.56" text-anchor="start" font-size="6.2" font-weight="600" letter-spacing="1.24" fill="#daa7c2" font-family="'Inter'">STRENGTH · MEMORY</text>
    <text x="24" y="91.16" text-anchor="start" font-size="17.5" font-weight="500" letter-spacing="-0.35" fill="#ffffff" font-family="'Manrope'">Creatine for Her</text>
    
    <text x="24" y="117.81" text-anchor="start" font-size="15" font-weight="500" letter-spacing="-0.3" fill="#ffffff" font-family="'Manrope'">5<tspan font-size="8.5" font-weight="500" dx="1.3">g</tspan></text>
      <text x="24" y="129.78" text-anchor="start" font-size="6.2" font-weight="500" letter-spacing="1.24" fill="rgba(255,255,255,0.78)" font-family="'Inter'">CREATINE MONOHYDRATE</text>
    <text x="24" y="146.96" font-size="7.2" text-anchor="start" font-weight="400" fill="rgba(255,255,255,0.78)" font-family="'Inter'">Supports strength, lean muscle and memory*</text>
    <rect x="24" y="182" width="176" height="0.5" fill="rgba(255,255,255,0.28)"/>
    <text x="24" y="199" text-anchor="start" font-size="6.2" font-weight="600" letter-spacing="1.24" fill="#ffffff" font-family="'Inter'">DIETARY SUPPLEMENT</text>
    <text x="24" y="208.5" text-anchor="start" font-size="6.2" font-weight="500" letter-spacing="1.24" fill="rgba(255,255,255,0.78)" font-family="'Inter'">50 SERVINGS</text>
    <text x="200" y="199" text-anchor="end" font-size="16" font-weight="500" fill="#ffffff" font-family="'Manrope'">281 g</text>
    <text x="200" y="209.5" text-anchor="end" font-size="6.2" font-weight="600" letter-spacing="1.24" fill="#ffffff" font-family="'Inter'">NET WT 9.9 OZ</text>
  </g></g>
  <g id="facts" transform="translate(774.33 37.5) scale(1.3)"><g><text x="0" y="17" font-size="17" font-weight="700" letter-spacing="-0.3" fill="#000" font-family="'Inter'">Supplement Facts</text><rect x="0" y="21" width="210" height="0.8" fill="#000"/><text x="0" y="32" font-size="8" fill="#000" font-family="'Inter'">Serving Size: 1 Scoop (5.6 g)</text><text x="0" y="43" font-size="8" fill="#000" font-family="'Inter'">Servings Per Container: 50</text><rect x="0" y="47" width="210" height="5" fill="#000"/><text x="0" y="60" font-size="8" font-weight="700" fill="#000" font-family="'Inter'">Amount Per Serving</text><text x="210" y="60" text-anchor="end" font-size="8" font-weight="700" fill="#000" font-family="'Inter'">% Daily Value</text><rect x="0" y="63" width="210" height="1.5" fill="#000"/><text x="0" y="74" font-size="8" fill="#000" font-family="'Inter'">Creatine Monohydrate</text><text x="176" y="74" text-anchor="end" font-size="8" fill="#000" font-family="'Inter'">5g</text><text x="210" y="74" text-anchor="end" font-size="8" font-weight="700" fill="#000" font-family="'Inter'">†</text><rect x="0" y="77" width="210" height="0.6" fill="#000"/><rect x="0" y="79" width="210" height="5" fill="#000"/><text x="0" y="91" font-size="8" fill="#000" font-family="'Inter'">† Daily Value not established.</text><text x="0" y="103" font-size="8" fill="#000" font-family="'Inter'">Other ingredients: None.</text></g></g>
  
