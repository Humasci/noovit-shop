<svg xmlns="http://www.w3.org/2000/svg" width="11.25in" height="3.25in" viewBox="0 0 1125 325">
  <title>Noovit tub label — Creatine for Her</title>
  <rect width="1125" height="325" fill="#542342"/>
  <rect x="24.5" y="24.5" width="379.33" height="276" rx="4" fill="#fff"/>
  <rect x="721.17" y="24.5" width="379.33" height="276" rx="4" fill="#fff"/>
  <g id="info" transform="translate(37.5 34.5) scale(1.36)"><g><text x="0" y="9" font-size="7" fill="#14213d" font-family="'Inter'"><tspan font-weight="700">Directions:</tspan> Mix 1 scoop (5.6 g) with 8 oz (237 ml) of water, juice or a</text><text x="0" y="18" font-size="7" fill="#14213d" font-family="'Inter'">smoothie once a day, any time. A loading phase is optional.</text><text x="0" y="30" font-size="7" fill="#14213d" font-family="'Inter'"><tspan font-weight="700">Caution:</tspan> Do not exceed the recommended dose. Consult your healthcare</text><text x="0" y="39" font-size="7" fill="#14213d" font-family="'Inter'">provider before use if you are pregnant, nursing, taking medication or</text><text x="0" y="48" font-size="7" fill="#14213d" font-family="'Inter'">have a medical condition. Not for use by anyone under 18. Keep out of</text><text x="0" y="57" font-size="7" fill="#14213d" font-family="'Inter'">reach of children.</text><text x="0" y="69" font-size="7" fill="#14213d" font-family="'Inter'"><tspan font-weight="700">Store</tspan> in a cool, dry place. Do not use if the seal under the cap is</text><text x="0" y="78" font-size="7" fill="#14213d" font-family="'Inter'">broken or missing.</text><rect x="0" y="86" width="250" height="33.4" fill="none" stroke="#14213d" stroke-width="0.6"/><text x="4" y="94" font-size="7" font-weight="700" fill="#14213d" font-family="'Inter'">*These statements have not been evaluated by the Food and Drug</text><text x="4" y="102.8" font-size="7" font-weight="700" fill="#14213d" font-family="'Inter'">Administration. This product is not intended to diagnose, treat,</text><text x="4" y="111.6" font-size="7" font-weight="700" fill="#14213d" font-family="'Inter'">cure, or prevent any disease.</text></g></g>
  <g id="distributor" transform="translate(112.5 254.5)">
    <text x="0" y="0" font-size="9" font-weight="700" fill="#14213d" font-family="'Inter'">Distributed by Noovit LLC</text>
    <text x="0" y="12" font-size="9" fill="#14213d" font-family="'Inter'">30 N Gould St Ste R, Sheridan, WY 82801</text>
    <text x="0" y="24" font-size="9" fill="#14213d" font-family="'Inter'">noovit.com</text>
  </g>
  <g id="front" transform="translate(415.83 12.5) scale(1.33)"><g>
    <rect x="0" y="-9.375" width="220" height="243.75" fill="#542342"/>
