  <g id="info" transform="translate(459.5 24.5)"><g><text x="0" y="9" font-size="7" fill="#14213d" font-family="'Inter'"><tspan font-weight="700">Directions:</tspan> Stir 1 scoop into coffee, tea or a</text><text x="0" y="18" font-size="7" fill="#14213d" font-family="'Inter'">smoothie daily.</text><text x="0" y="30" font-size="7" fill="#14213d" font-family="'Inter'"><tspan font-weight="700">Caution:</tspan> Consult your healthcare provider before use</text><text x="0" y="39" font-size="7" fill="#14213d" font-family="'Inter'">if you are pregnant, nursing, taking medication or</text><text x="0" y="48" font-size="7" fill="#14213d" font-family="'Inter'">have a medical condition. Keep out of reach of</text><text x="0" y="57" font-size="7" fill="#14213d" font-family="'Inter'">children.</text><text x="0" y="69" font-size="7" fill="#14213d" font-family="'Inter'"><tspan font-weight="700">Store</tspan> in a cool, dry place. Do not use if the seal</text><text x="0" y="78" font-size="7" fill="#14213d" font-family="'Inter'">under the cap is broken or missing.</text><rect x="0" y="86" width="190" height="32.2" fill="none" stroke="#14213d" stroke-width="0.6"/><text x="4" y="94" font-size="6.6" font-weight="700" fill="#14213d" font-family="'Inter'">*These statements have not been evaluated by the Food</text><text x="4" y="102.4" font-size="6.6" font-weight="700" fill="#14213d" font-family="'Inter'">and Drug Administration. This product is not intended</text><text x="4" y="110.8" font-size="6.6" font-weight="700" fill="#14213d" font-family="'Inter'">to diagnose, treat, cure, or prevent any disease.</text></g>
