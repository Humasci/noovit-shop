    <rect x="100.17" y="23.49" width="3.18" height="3.18" rx="0.38" fill="#ff5f00" opacity="1"/><rect x="100.17" y="19.8" width="3.18" height="3.18" rx="0.38" fill="#ff5f00" opacity="0.6"/><rect x="103.86" y="23.49" width="3.18" height="3.18" rx="0.38" fill="#ff5f00" opacity="0.8"/><rect x="100.17" y="27.18" width="3.18" height="3.18" rx="0.38" fill="#ff5f00" opacity="0.5"/><rect x="96.48" y="23.49" width="3.18" height="3.18" rx="0.38" fill="#ff5f00" opacity="0.4"/>
    <rect x="24" y="49" width="24" height="1.1" fill="#829ec0"/>
    <text x="24" y="66.56" text-anchor="start" font-size="6.2" font-weight="600" letter-spacing="1.24" fill="#9bb1cd" font-family="'Inter'">SLEEP · RECOVERY</text>
    <text x="24" y="91.16" text-anchor="start" font-size="17.5" font-weight="500" letter-spacing="-0.35" fill="#ffffff" font-family="'Manrope'">Magnesium</text>
    <text x="24" y="107.43" text-anchor="start" font-size="11" font-weight="400" letter-spacing="-0.1" fill="#9bb1cd" font-family="'Manrope'">Sleep+</text>
    <text x="24" y="132.65" text-anchor="start" font-size="15" font-weight="500" letter-spacing="-0.3" fill="#ffffff" font-family="'Manrope'">275<tspan font-size="8.5" font-weight="500" dx="1.3">mg</tspan></text>
      <text x="24" y="144.62" text-anchor="start" font-size="6.2" font-weight="500" letter-spacing="1.24" fill="rgba(255,255,255,0.78)" font-family="'Inter'">ELEMENTAL MAGNESIUM</text>
    <text x="24" y="161.8" font-size="7.2" text-anchor="start" font-weight="400" fill="rgba(255,255,255,0.78)" font-family="'Inter'">Supports relaxation, sleep</text><text x="24" y="171.2" font-size="7.2" text-anchor="start" font-weight="400" fill="rgba(255,255,255,0.78)" font-family="'Inter'">and muscle function*</text>
    <rect x="24" y="182" width="176" height="0.5" fill="rgba(255,255,255,0.28)"/>
    <text x="24" y="199" text-anchor="start" font-size="6.2" font-weight="600" letter-spacing="1.24" fill="#ffffff" font-family="'Inter'">DIETARY SUPPLEMENT</text>
    <text x="24" y="208.5" text-anchor="start" font-size="6.2" font-weight="500" letter-spacing="1.24" fill="rgba(255,255,255,0.78)" font-family="'Inter'">30 SERVINGS</text>
    <text x="200" y="199" text-anchor="end" font-size="16" font-weight="500" fill="#ffffff" font-family="'Manrope'">90</text>
    <text x="200" y="209.5" text-anchor="end" font-size="6.2" font-weight="600" letter-spacing="1.24" fill="#ffffff" font-family="'Inter'">CAPSULES</text>
  </g></g>
  <g id="facts" transform="translate(432.5 24.5) scale(1)"><g><text x="0" y="17" font-size="17" font-weight="700" letter-spacing="-0.3" fill="#000" font-family="'Inter'">Supplement Facts</text><rect x="0" y="21" width="168" height="0.8" fill="#000"/><text x="0" y="32" font-size="8" fill="#000" font-family="'Inter'">Serving Size: 3 Capsules</text><text x="0" y="43" font-size="8" fill="#000" font-family="'Inter'">Servings Per Container: 30</text><rect x="0" y="47" width="168" height="5" fill="#000"/><text x="0" y="60" font-size="8" font-weight="700" fill="#000" font-family="'Inter'">Amount Per Serving</text><text x="168" y="60" text-anchor="end" font-size="8" font-weight="700" fill="#000" font-family="'Inter'">% Daily Value</text><rect x="0" y="63" width="168" height="1.5" fill="#000"/><text x="0" y="74" font-size="8" fill="#000" font-family="'Inter'">Magnesium (as Magnesium</text><text x="0" y="84" font-size="8" fill="#000" font-family="'Inter'">Glycinate)</text><text x="134" y="74" text-anchor="end" font-size="8" fill="#000" font-family="'Inter'">275mg</text><text x="168" y="74" text-anchor="end" font-size="8" font-weight="700" fill="#000" font-family="'Inter'">65%</text><rect x="0" y="87" width="168" height="0.6" fill="#000"/><rect x="0" y="89" width="168" height="5" fill="#000"/><text x="0" y="101" font-size="8" fill="#000" font-family="'Inter'">Other ingredients: Vegetable capsule</text><text x="0" y="111" font-size="8" fill="#000" font-family="'Inter'">(hypromellose), magnesium stearate,</text><text x="0" y="121" font-size="8" fill="#000" font-family="'Inter'">silicon dioxide, rice flour.</text></g></g>
