  </g>
    <text x="110" y="52" text-anchor="middle" font-size="6.8" font-weight="600" letter-spacing="1.3" fill="#3a8069" font-family="'Inter'">HIGHLY ABSORBABLE PEPTIDES</text>
    <text x="110" y="89.25" font-size="35" text-anchor="middle" font-weight="600" letter-spacing="-0.7" fill="#14213d" font-family="'Manrope'">Collagen</text><text x="110" y="124.25" font-size="35" text-anchor="middle" font-weight="600" letter-spacing="-0.7" fill="#14213d" font-family="'Manrope'">Complex</text>
    <text x="110" y="143.75" font-size="9" text-anchor="middle" fill="#374151" font-family="'Inter'">Supports skin elasticity, hair and</text><text x="110" y="154.75" font-size="9" text-anchor="middle" fill="#374151" font-family="'Inter'">nails*</text>
    <rect x="0" y="162" width="220" height="75.5" fill="#D98B8B"/>
    <text x="110" y="176" text-anchor="middle" font-size="6.3" font-weight="500" letter-spacing="0.6" fill="#fff" opacity="0.92" font-family="'Inter'">Gluten-free  ·  Sugar-free</text>
    <text x="110" y="192" text-anchor="middle" font-size="7.2" font-weight="600" letter-spacing="1.6" fill="#fff" font-family="'Inter'">DIETARY SUPPLEMENT</text>
    <text x="110" y="208" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="0.8" fill="#fff" font-family="'Inter'">60 CAPSULES</text>
  </g></g>
  <g id="info" transform="translate(459.5 24.5)"><g><text x="0" y="9" font-size="7" fill="#14213d" font-family="'Inter'"><tspan font-weight="700">Directions:</tspan> Take 2 capsules daily.</text><text x="0" y="21" font-size="7" fill="#14213d" font-family="'Inter'"><tspan font-weight="700">Caution:</tspan> Consult your healthcare provider before use</text><text x="0" y="30" font-size="7" fill="#14213d" font-family="'Inter'">if you are pregnant, nursing, taking medication or</text><text x="0" y="39" font-size="7" fill="#14213d" font-family="'Inter'">have a medical condition. Keep out of reach of</text><text x="0" y="48" font-size="7" fill="#14213d" font-family="'Inter'">children.</text><text x="0" y="60" font-size="7" fill="#14213d" font-family="'Inter'"><tspan font-weight="700">Store</tspan> in a cool, dry place. Do not use if the seal</text><text x="0" y="69" font-size="7" fill="#14213d" font-family="'Inter'">under the cap is broken or missing.</text><rect x="0" y="77" width="190" height="32.2" fill="none" stroke="#14213d" stroke-width="0.6"/><text x="4" y="85" font-size="6.6" font-weight="700" fill="#14213d" font-family="'Inter'">*These statements have not been evaluated by the Food</text><text x="4" y="93.4" font-size="6.6" font-weight="700" fill="#14213d" font-family="'Inter'">and Drug Administration. This product is not intended</text><text x="4" y="101.8" font-size="6.6" font-weight="700" fill="#14213d" font-family="'Inter'">to diagnose, treat, cure, or prevent any disease.</text></g>
