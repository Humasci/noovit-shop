<svg xmlns="http://www.w3.org/2000/svg" width="6.75in" height="2.5in" viewBox="0 0 675 250">
  <title>Noovit label — Collagen Complex (draft)</title>
  <rect width="675" height="250" fill="#fff"/>
  <g id="facts" transform="translate(25.5 24.5)"><g><text x="0" y="17" font-size="17" font-weight="700" letter-spacing="-0.3" fill="#000" font-family="'Inter'">Supplement Facts</text><rect x="0" y="21" width="190" height="0.8" fill="#000"/><text x="0" y="32" font-size="8" fill="#000" font-family="'Inter'">Serving Size: 2 Capsules</text><text x="0" y="43" font-size="8" fill="#000" font-family="'Inter'">Servings Per Container: 30</text><rect x="0" y="47" width="190" height="5" fill="#000"/><text x="0" y="60" font-size="7" font-weight="700" fill="#000" font-family="'Inter'">Amount Per Serving</text><text x="190" y="60" text-anchor="end" font-size="7" font-weight="700" fill="#000" font-family="'Inter'">% Daily Value</text><rect x="0" y="63" width="190" height="1.5" fill="#000"/><text x="0" y="74" font-size="8" fill="#000" font-family="'Inter'">Hydrolysed Collagen Peptides</text><text x="160" y="74" text-anchor="end" font-size="8" fill="#000" font-family="'Inter'">1000mg</text><text x="190" y="74" text-anchor="end" font-size="8" fill="#000" font-family="'Inter'">†</text><rect x="0" y="77" width="190" height="0.6" fill="#000"/><text x="0" y="88" font-size="8" fill="#000" font-family="'Inter'">Hyaluronic Acid</text><text x="160" y="88" text-anchor="end" font-size="8" fill="#000" font-family="'Inter'">50mg</text><text x="190" y="88" text-anchor="end" font-size="8" fill="#000" font-family="'Inter'">†</text><rect x="0" y="91" width="190" height="0.6" fill="#000"/><text x="0" y="102" font-size="8" fill="#000" font-family="'Inter'">Vitamin C</text><text x="160" y="102" text-anchor="end" font-size="8" fill="#000" font-family="'Inter'">80mg</text><text x="190" y="102" text-anchor="end" font-size="8" fill="#000" font-family="'Inter'">†</text><rect x="0" y="105" width="190" height="0.6" fill="#000"/><rect x="0" y="107" width="190" height="5" fill="#000"/><text x="0" y="119" font-size="7" fill="#000" font-family="'Inter'">† Daily Value not established.</text><text x="0" y="131" font-size="7" fill="#000" font-family="'Inter'">Other ingredients: Vegetable capsule (HPMC).</text></g></g>
