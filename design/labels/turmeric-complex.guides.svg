  <g id="info" transform="translate(24.5 24.5)"><g><text x="0" y="9" font-size="7" fill="#14213d" font-family="'Inter'"><tspan font-weight="700">Directions:</tspan> Take 2 capsules once a day, 20–30</text><text x="0" y="18" font-size="7" fill="#14213d" font-family="'Inter'">minutes before a meal.</text><text x="0" y="30" font-size="7" fill="#14213d" font-family="'Inter'"><tspan font-weight="700">Caution:</tspan> Do not exceed the recommended dose.</text><text x="0" y="39" font-size="7" fill="#14213d" font-family="'Inter'">Consult your healthcare provider before use if</text><text x="0" y="48" font-size="7" fill="#14213d" font-family="'Inter'">you are pregnant, nursing, taking medication or</text><text x="0" y="57" font-size="7" fill="#14213d" font-family="'Inter'">have a medical condition. Keep out of reach of</text><text x="0" y="66" font-size="7" fill="#14213d" font-family="'Inter'">children.</text><text x="0" y="78" font-size="7" fill="#14213d" font-family="'Inter'"><tspan font-weight="700">Store</tspan> in a cool, dry place. Do not use if the</text><text x="0" y="87" font-size="7" fill="#14213d" font-family="'Inter'">seal under the cap is broken or missing.</text><rect x="0" y="95" width="168" height="42.2" fill="none" stroke="#14213d" stroke-width="0.6"/><text x="4" y="103" font-size="7" font-weight="700" fill="#14213d" font-family="'Inter'">*These statements have not been evaluated</text><text x="4" y="111.8" font-size="7" font-weight="700" fill="#14213d" font-family="'Inter'">by the Food and Drug Administration. This</text><text x="4" y="120.6" font-size="7" font-weight="700" fill="#14213d" font-family="'Inter'">product is not intended to diagnose, treat,</text><text x="4" y="129.4" font-size="7" font-weight="700" fill="#14213d" font-family="'Inter'">cure, or prevent any disease.</text></g>
