    <text x="24" y="66.56" text-anchor="start" font-size="6.2" font-weight="600" letter-spacing="1.24" fill="#82acc7" font-family="'Inter'">ENERGY · HEALTHY AGING</text>
    <text x="24" y="91.16" text-anchor="start" font-size="17.5" font-weight="500" letter-spacing="-0.35" fill="#ffffff" font-family="'Manrope'">NAD+</text>
    <text x="24" y="107.43" text-anchor="start" font-size="11" font-weight="400" letter-spacing="-0.1" fill="#82acc7" font-family="'Manrope'">Complex</text>
    <text x="24" y="127.33" font-size="7.6" text-anchor="start" font-weight="500" fill="#ffffff" font-family="'Inter'">500mg NAD+, Quercetin &amp; Resveratrol</text>
    <text x="24" y="146.18" font-size="7.2" text-anchor="start" font-weight="400" fill="rgba(255,255,255,0.78)" font-family="'Inter'">Supports cellular energy and healthy aging*</text>
