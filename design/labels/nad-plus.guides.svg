  <g id="facts" transform="translate(432.5 24.5) scale(0.88)"><g><text x="0" y="17" font-size="17" font-weight="700" letter-spacing="-0.3" fill="#000" font-family="'Inter'">Supplement Facts</text><rect x="0" y="21" width="192" height="0.8" fill="#000"/><text x="0" y="32" font-size="8" fill="#000" font-family="'Inter'">Serving Size: 2 Capsules</text><text x="0" y="43" font-size="8" fill="#000" font-family="'Inter'">Servings Per Container: 30</text><rect x="0" y="47" width="192" height="5" fill="#000"/><text x="0" y="60" font-size="8" font-weight="700" fill="#000" font-family="'Inter'">Amount Per Serving</text><text x="192" y="60" text-anchor="end" font-size="8" font-weight="700" fill="#000" font-family="'Inter'">% Daily Value</text><rect x="0" y="63" width="192" height="1.5" fill="#000"/><text x="0" y="74" font-size="8" fill="#000" font-family="'Inter'">NAD+ (Nicotinamide Adenine</text><text x="0" y="84" font-size="8" fill="#000" font-family="'Inter'">Dinucleotide)</text><text x="158" y="74" text-anchor="end" font-size="8" fill="#000" font-family="'Inter'">500mg</text><text x="192" y="74" text-anchor="end" font-size="8" font-weight="700" fill="#000" font-family="'Inter'">†</text><rect x="0" y="87" width="192" height="0.6" fill="#000"/><text x="0" y="98" font-size="8" fill="#000" font-family="'Inter'">Quercetin Dihydrate Extract</text><text x="0" y="108" font-size="8" fill="#000" font-family="'Inter'">(Sophora japonica flower bud)</text><text x="158" y="98" text-anchor="end" font-size="8" fill="#000" font-family="'Inter'">250mg</text><text x="192" y="98" text-anchor="end" font-size="8" font-weight="700" fill="#000" font-family="'Inter'">†</text><rect x="0" y="111" width="192" height="0.6" fill="#000"/><text x="0" y="122" font-size="8" fill="#000" font-family="'Inter'">Japanese Knotweed Root</text><text x="0" y="132" font-size="8" fill="#000" font-family="'Inter'">Extract (98% resveratrol)</text><text x="158" y="122" text-anchor="end" font-size="8" fill="#000" font-family="'Inter'">150mg</text><text x="192" y="122" text-anchor="end" font-size="8" font-weight="700" fill="#000" font-family="'Inter'">†</text><rect x="0" y="135" width="192" height="0.6" fill="#000"/><rect x="0" y="137" width="192" height="5" fill="#000"/><text x="0" y="149" font-size="8" fill="#000" font-family="'Inter'">† Daily Value not established.</text><text x="0" y="161" font-size="8" fill="#000" font-family="'Inter'">Other ingredients: HPMC (vegetable capsule),</text><text x="0" y="171" font-size="8" fill="#000" font-family="'Inter'">microcrystalline cellulose, brown rice flour,</text><text x="0" y="181" font-size="8" fill="#000" font-family="'Inter'">olive oil, silicon dioxide, magnesium stearate.</text></g></g>
