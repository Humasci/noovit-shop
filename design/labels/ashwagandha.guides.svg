  <g id="facts" transform="translate(432.5 24.5) scale(0.88)"><g><text x="0" y="17" font-size="17" font-weight="700" letter-spacing="-0.3" fill="#000" font-family="'Inter'">Supplement Facts</text><rect x="0" y="21" width="192" height="0.8" fill="#000"/><text x="0" y="32" font-size="8" fill="#000" font-family="'Inter'">Serving Size: 2 Capsules</text><text x="0" y="43" font-size="8" fill="#000" font-family="'Inter'">Servings Per Container: 30</text><rect x="0" y="47" width="192" height="5" fill="#000"/><text x="0" y="58.5" font-size="8" font-weight="700" fill="#000" font-family="'Inter'">Amount Per Serving</text><text x="192" y="58.5" text-anchor="end" font-size="8" font-weight="700" fill="#000" font-family="'Inter'">% Daily Value</text><rect x="0" y="61.5" width="192" height="1.5" fill="#000"/><text x="0" y="70.4" font-size="8" fill="#000" font-family="'Inter'">Vitamin D3 (cholecalciferol)</text><text x="158" y="70.4" text-anchor="end" font-size="8" fill="#000" font-family="'Inter'">20mcg</text><text x="192" y="70.4" text-anchor="end" font-size="8" font-weight="700" fill="#000" font-family="'Inter'">100%</text><rect x="0" y="72.5" width="192" height="0.6" fill="#000"/><text x="0" y="81.4" font-size="8" fill="#000" font-family="'Inter'">Vitamin B6 (pyridoxine HCl)</text><text x="158" y="81.4" text-anchor="end" font-size="8" fill="#000" font-family="'Inter'">2.5mg</text><text x="192" y="81.4" text-anchor="end" font-size="8" font-weight="700" fill="#000" font-family="'Inter'">147%</text><rect x="0" y="83.5" width="192" height="0.6" fill="#000"/><text x="0" y="92.4" font-size="8" fill="#000" font-family="'Inter'">Vitamin B12 (methylcobalamin)</text><text x="158" y="92.4" text-anchor="end" font-size="8" fill="#000" font-family="'Inter'">25mcg</text><text x="192" y="92.4" text-anchor="end" font-size="8" font-weight="700" fill="#000" font-family="'Inter'">1042%</text><rect x="0" y="94.5" width="192" height="0.6" fill="#000"/><text x="0" y="103.4" font-size="8" fill="#000" font-family="'Inter'">KSM-66® Ashwagandha Root</text><text x="0" y="112.2" font-size="8" fill="#000" font-family="'Inter'">Extract (5% withanolides)</text><text x="158" y="103.4" text-anchor="end" font-size="8" fill="#000" font-family="'Inter'">600mg</text><text x="192" y="103.4" text-anchor="end" font-size="8" font-weight="700" fill="#000" font-family="'Inter'">†</text><rect x="0" y="114.30000000000001" width="192" height="0.6" fill="#000"/><text x="0" y="123.2" font-size="8" fill="#000" font-family="'Inter'">L-Arginine</text><text x="158" y="123.20000000000002" text-anchor="end" font-size="8" fill="#000" font-family="'Inter'">300mg</text><text x="192" y="123.20000000000002" text-anchor="end" font-size="8" font-weight="700" fill="#000" font-family="'Inter'">†</text><rect x="0" y="125.30000000000001" width="192" height="0.6" fill="#000"/><text x="0" y="134.2" font-size="8" fill="#000" font-family="'Inter'">Maca Root Powder</text><text x="158" y="134.20000000000002" text-anchor="end" font-size="8" fill="#000" font-family="'Inter'">150mg</text><text x="192" y="134.20000000000002" text-anchor="end" font-size="8" font-weight="700" fill="#000" font-family="'Inter'">†</text><rect x="0" y="136.3" width="192" height="0.6" fill="#000"/><text x="0" y="145.2" font-size="8" fill="#000" font-family="'Inter'">Panax Ginseng Root Powder</text><text x="158" y="145.20000000000002" text-anchor="end" font-size="8" fill="#000" font-family="'Inter'">100mg</text><text x="192" y="145.20000000000002" text-anchor="end" font-size="8" font-weight="700" fill="#000" font-family="'Inter'">†</text><rect x="0" y="147.3" width="192" height="0.6" fill="#000"/><text x="0" y="156.2" font-size="8" fill="#000" font-family="'Inter'">Shatavari Root Powder</text><text x="158" y="156.20000000000002" text-anchor="end" font-size="8" fill="#000" font-family="'Inter'">50mg</text><text x="192" y="156.20000000000002" text-anchor="end" font-size="8" font-weight="700" fill="#000" font-family="'Inter'">†</text><rect x