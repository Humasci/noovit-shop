  <g id="info" transform="translate(24.5 24.5)"><g><text x="0" y="9" font-size="7" fill="#14213d" font-family="'Inter'"><tspan font-weight="700">Directions:</tspan> Mix 1 scoop (2.3 g) into 6–8 oz</text><text x="0" y="18" font-size="7" fill="#14213d" font-family="'Inter'">(177–237 ml) of cold water or your favorite</text><text x="0" y="27" font-size="7" fill="#14213d" font-family="'Inter'">drink once a day. Drink within 10 minutes of</text><text x="0" y="36" font-size="7" fill="#14213d" font-family="'Inter'">mixing.</text><text x="0" y="48" font-size="7" fill="#14213d" font-family="'Inter'"><tspan font-weight="700">Caution:</tspan> Do not exceed the recommended dose.</text><text x="0" y="57" font-size="7" fill="#14213d" font-family="'Inter'">Consult your healthcare provider before use if</text><text x="0" y="66" font-size="7" fill="#14213d" font-family="'Inter'">you are pregnant, nursing, taking medication or</text><text x="0" y="75" font-size="7" fill="#14213d" font-family="'Inter'">have a medical condition. Not for use by anyone</text><text x="0" y="84" font-size="7" fill="#14213d" font-family="'Inter'">under 18. Keep out of reach of children.</text><text x="0" y="96" font-size="7" fill="#14213d" font-family="'Inter'"><tspan font-weight="700">Store</tspan> in a cool, dry place. Do not use if the</text><text x="0" y="105" font-size="7" fill="#14213d" font-family="'Inter'">seal under the cap is broken or missing.</text><rect x="0" y="113" width="168" height="42.2" fill="none" stroke="#14213d" stroke-width="0.6"/><text x="4" y="121" font-size="7" font-weight="700" fill="#14213d" font-family="'Inter'">*These statements have not been evaluated</text><text x="4" y="129.8" font-size="7" font-weight="700" fill="#14213d" font-family="'Inter'">by the Food and Drug Administration. This</text><text x="4" y="138.6" font-size="7" font-weight="700" fill="#14213d" font-family="'Inter'">product is not intended to diagnose, treat,</text><text x="4" y="147.4" font-size="7" font-weight="700" fill="#14213d" font-family="'Inter'">cure, or prevent any disease.</text></g>
    <g transform="translate(0 173)">
